# Quality gates (TASK-015). One stage, three jobs, every one of them a required status check on the
# protected branches (TASK-012, .github/branch-protection/protected-branches.ruleset.json).
# A lint error, a format violation, a type error, an analyzer warning or a failing unit test fails the PR.
# `timeout-minutes: 10` holds each job to the agreed gate budget.
name: ci-quality-gates

on:
  pull_request:
    branches: [main, dev, stage]
  # `main` is not here: a push to main starts ci-cd-pipeline.yml, which calls this workflow as its
  # first gate (TASK-018). Running it twice on the same commit would be the same checks reported in
  # two places, and only one of them gating the deployment. `dev` and `stage` keep their push trigger
  # until they are retired (branching-strategy.md §2.1).
  push:
    branches: [dev, stage]
  # Called by ci-cd-pipeline.yml so the pipeline gates on the same checks that guard the pull
  # request, rather than on a copy of them that can drift.
  workflow_call:

permissions:
  contents: read

# Keyed on the workflow too: a called run and a pull-request run on the same ref are different gates
# and must not cancel one another.
concurrency:
  group: ci-quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore src/backend

      # Analyzers and code style are on in Directory.Build.props; -warnaserror is the belt to that braces.
      - name: Build (analyzers, warnings as errors)
        run: dotnet build src/backend --no-restore --configuration Release -warnaserror

      # Unit tests only. PMPlatform.Tests.Integration needs the containerised stack and gets its own stage.
      - name: Unit tests
        run: dotnet test src/backend/PMPlatform.Tests.Unit --no-build --configuration Release

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  repo-checks:
    name: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Standard library only; the runner's python3 is enough (no setup-python step).
      - name: API and event contracts (TASK-009)
        run: python3 docs/architecture/contract-check.py

      - name: ERD consistency (TASK-008)
        run: python3 docs/architecture/erd-check.py

      - name: Environment templates (TASK-013)
        run: python3 docs/architecture/env-template-check.py

      - name: Local-stack bridge schema (TASK-014)
        run: python3 docs/architecture/local-stack-check.py

      - name: Environment separation (TASK-016)
        run: python3 docs/architecture/environment-separation-check.py

      - name: Infrastructure as code (TASK-017)
        run: python3 docs/architecture/terraform-check.py

      - name: Promotion pipeline (TASK-018)
        run: python3 docs/architecture/cicd-pipeline-check.py

  # The IaC is reviewed like application code and gated like it (TASK-017, CTL-05). Format,
  # schema and a static security scan run on every pull request; `terraform plan` needs the
  # region, the tenancy and a credential and so belongs to the deploy pipeline (TASK-018),
  # not to this gate.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          # Must equal infra/terraform/.terraform-version; terraform-check.py T-6 fails the PR if
          # it stops matching, because the committed lock files were produced with this version.
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      # -lockfile=readonly makes the committed .terraform.lock.hcl authoritative: if it does not
      # cover the runner's platform, or drifts from the constraint, the job fails rather than
      # quietly resolving a different provider build from the one that was reviewed.
      - name: Validate every environment root
        run: |
          for env in dev sit uat prod; do
            echo "== $env =="
            terraform -chdir="infra/terraform/environments/$env" init \
              -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/terraform/environments/$env" validate
          done

      # tfsec is retired and its rules now ship in Trivy; the check the workbook asks for is the
      # same one. Zero HIGH or CRITICAL is the TASK-017 validation cell.
      - name: Static security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: 1
