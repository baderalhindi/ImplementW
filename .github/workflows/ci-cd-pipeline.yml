# Controlled promotion pipeline (TASK-018, CTL-40). Record: docs/architecture/cicd-pipeline.md
#
# Build once on main, then promote that one artifact through DEV, SIT, UAT and PROD. Each stage is a
# job that needs the one before it and names a GitHub deployment environment; the environment's
# required reviewers are what halt the job, and GitHub records who released it and when
# (infra/environments/github/environments.json, TASK-016 §4).
#
# Three properties are what this file exists for, and each is mechanical rather than asserted:
#
#   PROD cannot be deployed to without a recorded approval. `environment: prod` halts the job until a
#   reviewer approves, and .github/scripts/deployment-record.sh then reads that approval back and
#   fails the deployment if it carries no identity or no timestamp.
#
#   A failed gate blocks promotion. quality-gates, dependency-scan, package (the image scan) and
#   migration-dry-run are needs of deploy-dev, and every later stage needs the stage before it, so a
#   red gate skips all four. Each stage also re-scans the release's SBOM before it deploys, so a CVE
#   published after the build still stops the promotion (TASK-022).
#
#   Every deployment names a commit SHA and a Task ID. release-metadata fails the run if the commit
#   being released names no task, and both travel with the image into every deployment record.
#
# Nothing is deployed today: the region, the tenancy, the DNS zone and the artifact registry project
# are outstanding, so `preflight` reports not-ready and the four deploy stages are skipped. The build,
# the scan and the gates all run in full.
name: ci-cd-pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit to promote. Defaults to the head of main — set it to re-promote an earlier release, which is how a rollback is issued.
        required: false
        type: string

permissions:
  contents: read

# Not keyed on the ref: main is the only ref that promotes, and two promotions at once would race
# for the same environments. A run waiting at an approval gate holds the queue, which is the
# intended behaviour — the queued run is the release that would follow this one.
concurrency:
  group: ci-cd-pipeline
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Stage 1: what is being released ───────────────────────────────────────────────────────────
  release-metadata:
    name: release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      task_id: ${{ steps.metadata.outputs.task_id }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - id: metadata
        run: .github/scripts/release-metadata.sh
        env:
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}

  # Readiness is evaluated once, early, so a run that cannot deploy says so at the top rather than
  # after twenty minutes of building. It is evaluated again inside each deploy stage, with --require,
  # because a value can be emptied between the two.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
      image_repository: ${{ steps.preflight.outputs.image_repository }}
      region: ${{ steps.preflight.outputs.region }}
    steps:
      - uses: actions/checkout@v4
      - id: preflight
        run: .github/scripts/deploy-preflight.sh
        env:
          ADR001_CONFIRMATION_REF: ${{ vars.ADR001_CONFIRMATION_REF }}

  # ── Stage 2: the gates ────────────────────────────────────────────────────────────────────────
  # TASK-015's gate, called rather than restated, so the pipeline cannot drift from the checks that
  # guard the pull request. Its jobs report here as `quality-gates / backend`, `… / frontend`,
  # `… / repo-checks` and `… / terraform`.
  quality-gates:
    name: quality-gates
    uses: ./.github/workflows/ci-quality-gates.yml
    permissions:
      contents: read

  # CTL-41 at the source: an SBOM of the backend and frontend package manifests, a report of every
  # finding in it, and the gate (TASK-022). A job of its own rather than a step of `package`, and
  # needing nothing but the release metadata, so the report is attached to every build — including
  # one the quality gate fails. NuGet's own audit makes `dotnet restore` fail on a vulnerable package
  # under warnings-as-errors, so a release carrying one never reaches `package`.
  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-metadata]
    env:
      EVIDENCE_DIR: artifacts/security
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The lock files this restore writes are the transitive graph the SBOM is read from; they are
      # not committed. NuGetAudit is off for this restore only: its verdict is the quality gate's,
      # and here it would stop the restore before the vulnerable package could be recorded,
      # reported and gated.
      - name: Resolve the backend dependency graph
        run: dotnet restore src/backend -p:RestorePackagesWithLockFile=true -p:NuGetAudit=false

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      - name: SBOM of the package manifests
        run: .github/scripts/release-security-scan.sh sbom-manifests

      - name: Dependency scan report
        run: .github/scripts/release-security-scan.sh scan

      # Before the gate, so a blocked build still carries the report that says why.
      - name: Attach the SBOM and the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-dependencies
          path: artifacts/security/
          retention-days: 90
          if-no-files-found: error

      - name: Gate
        run: .github/scripts/release-security-scan.sh gate

  # CTL-40's "failed security scan blocks promotion", and CTL-41 at the artifact. The image is built
  # here once, from a source tree the dependency scan has passed; its SBOM covers the base image's OS
  # packages and the published .NET closure, and is scanned and gated before the image is pushed.
  # The pushed digest is signed and carries the SBOM as an attestation (TASK-022). TASK-080 covers
  # source-level secrets and the same scan on the pull request.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-metadata, preflight, quality-gates, dependency-scan]
    # id-token is for keyless signing only: the workflow's OIDC identity is what the signature
    # certifies, so no signing key exists to be stored, rotated or leaked.
    permissions:
      contents: read
      id-token: write
    env:
      EVIDENCE_DIR: artifacts/security
    outputs:
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}

      - uses: docker/setup-buildx-action@v3

      # Built to the local daemon first: an image is scanned before it is pushed, so a CRITICAL
      # finding never reaches a registry any environment can pull from.
      - name: Build the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          load: true
          tags: pmplatform-api:${{ needs.release-metadata.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-metadata.outputs.commit_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ahda.task-id=${{ needs.release-metadata.outputs.task_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      - name: SBOM of the release image
        run: .github/scripts/release-security-scan.sh sbom-image "pmplatform-api:${{ needs.release-metadata.outputs.image_tag }}"

      - name: Image scan report
        run: .github/scripts/release-security-scan.sh scan

      - name: Attach the SBOM and the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-image
          path: artifacts/security/
          retention-days: 90
          if-no-files-found: error

      # Zero fixable HIGH or CRITICAL, the threshold TASK-018 set for this image. Before the push, so a
      # blocked image never reaches a registry any environment can pull from.
      - name: Gate
        run: .github/scripts/release-security-scan.sh gate

      - name: Authenticate to the container registry
        if: ${{ needs.preflight.outputs.ready == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.preflight.outputs.region }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      # The digest, not the tag, is what every environment is deployed from. One artifact built once
      # and promoted unchanged (environment-separation.md §4) is a claim a digest can carry and a tag
      # cannot: a tag can be moved, a digest is the image.
      - name: Push and capture the digest
        id: push
        if: ${{ needs.preflight.outputs.ready == 'true' }}
        env:
          REPOSITORY: ${{ needs.preflight.outputs.image_repository }}
          TAG: ${{ needs.release-metadata.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker tag "pmplatform-api:$TAG" "$REPOSITORY:$TAG"
          docker push "$REPOSITORY:$TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$TAG")
          echo "image_digest=$digest" >>"$GITHUB_OUTPUT"
          echo "pushed $digest" >>"$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@v4.1.2
        if: ${{ needs.preflight.outputs.ready == 'true' }}
        with:
          cosign-release: v3.1.3

      # Keyless: the certificate names this workflow, on this ref, at this commit, and the signature is
      # recorded in the public Sigstore transparency log. Every deploy stage verifies it before the
      # image is used (.github/actions/deploy-environment), so an image this workflow did not build
      # on main cannot be deployed. The SBOM travels with the digest as a signed attestation.
      - name: Sign the image and attest its SBOM
        if: ${{ needs.preflight.outputs.ready == 'true' }}
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST"
          cosign attest --yes --type cyclonedx --predicate "$EVIDENCE_DIR/sbom-api-image.cdx.json" "$IMAGE_DIGEST"
          echo "signed $IMAGE_DIGEST and attested its SBOM" >>"$GITHUB_STEP_SUMMARY"

  # CTL-40's "failed migration dry-run blocks promotion". Runs against a scratch database, so it is
  # independent of every environment and of whether any environment exists. The seed and the data-integrity
  # check run on the result (TASK-027), so a seed that fails or a violation also blocks promotion.
  migration-dry-run:
    name: migration-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release-metadata, quality-gates]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: scratch
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The version pinned in .config/dotnet-tools.json (TASK-024), the one migrations are authored with.
      - name: Install dotnet-ef
        run: dotnet tool restore

      - name: Build
        run: dotnet build src/backend/PMPlatform.Api --configuration Release

      - name: Dry-run the release's migrations
        env:
          DATABASE_URL: postgres://postgres:scratch@localhost:5432/scratch
        run: .github/scripts/migration-dry-run.sh

      # TASK-027: the post-migration step every deployment runs (seed, then validate-data-integrity), on the database
      # just migrated, with a second seed run in between that must change nothing.
      - name: Seed and validate data integrity
        env:
          DATABASE_URL: postgres://postgres:scratch@localhost:5432/scratch
          DB_CONNECTION_STRING: Host=localhost;Port=5432;Database=scratch;Username=postgres;Password=scratch
        run: .github/scripts/seed-dry-run.sh

  # ── Stage 3 to 6: the promotion path ──────────────────────────────────────────────────────────
  # G-1, automatic. Every gate the workbook names is a `needs` of this job, so a red gate skips DEV
  # and, through the chain below it, SIT, UAT and PROD.
  deploy-dev:
    name: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-metadata, preflight, quality-gates, dependency-scan, package, migration-dry-run]
    if: ${{ success() && needs.preflight.outputs.ready == 'true' }}
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: dev
          task-id: ${{ needs.release-metadata.outputs.task_id }}
          commit-sha: ${{ needs.release-metadata.outputs.commit_sha }}
          image-digest: ${{ needs.package.outputs.image_digest }}
          deploy-service-account-key: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_KEY }}
          github-token: ${{ github.token }}
          authorisation-ref: ${{ vars.ADR001_CONFIRMATION_REF }}
          migration-job: ${{ vars.MIGRATION_JOB }}

  # G-2, DevOps Lead.
  deploy-sit:
    name: deploy-sit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-metadata, preflight, package, deploy-dev]
    if: ${{ success() && needs.preflight.outputs.ready == 'true' }}
    environment:
      name: sit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: sit
          task-id: ${{ needs.release-metadata.outputs.task_id }}
          commit-sha: ${{ needs.release-metadata.outputs.commit_sha }}
          image-digest: ${{ needs.package.outputs.image_digest }}
          deploy-service-account-key: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_KEY }}
          github-token: ${{ github.token }}
          authorisation-ref: ${{ vars.ADR001_CONFIRMATION_REF }}
          migration-job: ${{ vars.MIGRATION_JOB }}

  # G-3, QA Lead and Security Lead.
  deploy-uat:
    name: deploy-uat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-metadata, preflight, package, deploy-sit]
    if: ${{ success() && needs.preflight.outputs.ready == 'true' }}
    environment:
      name: uat
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: uat
          task-id: ${{ needs.release-metadata.outputs.task_id }}
          commit-sha: ${{ needs.release-metadata.outputs.commit_sha }}
          image-digest: ${{ needs.package.outputs.image_digest }}
          deploy-service-account-key: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_KEY }}
          github-token: ${{ github.token }}
          authorisation-ref: ${{ vars.ADR001_CONFIRMATION_REF }}
          migration-job: ${{ vars.MIGRATION_JOB }}

  # G-4, Delivery Lead and AHDA Sponsor. The manual gate the workbook asks for: this job does not
  # start until a reviewer on the `prod` environment approves it, and the approval is written into
  # the deployment record with the approver's identity and the timestamp GitHub recorded.
  deploy-prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-metadata, preflight, package, deploy-uat]
    if: ${{ success() && needs.preflight.outputs.ready == 'true' }}
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.commit_sha }}
      - uses: ./.github/actions/deploy-environment
        with:
          environment: prod
          task-id: ${{ needs.release-metadata.outputs.task_id }}
          commit-sha: ${{ needs.release-metadata.outputs.commit_sha }}
          image-digest: ${{ needs.package.outputs.image_digest }}
          deploy-service-account-key: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_KEY }}
          github-token: ${{ github.token }}
          authorisation-ref: ${{ vars.ADR001_CONFIRMATION_REF }}
          migration-job: ${{ vars.MIGRATION_JOB }}
