# Secret scanning (TASK-080, CTL-42). Record: docs/architecture/secret-and-dependency-scanning.md
#
# Two jobs, one scanner (gitleaks, pinned and checksum-verified) and one configuration (.gitleaks.toml):
#
#   secret-scan           every pull request and every push to a protected branch: the commits the change
#                         adds. A required status check (.github/branch-protection), so a credential-looking
#                         string in any commit of a pull request blocks its merge, including a commit whose
#                         value a later commit deletes: the value is already on GitHub either way.
#   secret-scan-history   weekly and on demand: every commit on every ref, reported to the named owner in
#                         .github/security/scan-owner.yaml whether or not anything was found.
#
# The pull-request scan reads the base's .gitleaks.toml and .gitleaksignore and ignores inline
# `gitleaks:allow`, so a change cannot allowlist its own finding (.github/scripts/secret-scan.sh).
name: secret-scan

on:
  pull_request:
    branches: [main, dev, stage]
  push:
    branches: [main, dev, stage]
  # Mondays 03:17 UTC (06:17 Riyadh), before the working week; off the hour, when GitHub's scheduler is busiest.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_DIR: artifacts/security/secret-scan
    steps:
      - uses: actions/checkout@v4
        with:
          # The base and every commit of the change must be in the clone; a shallow one would scan
          # only the tip and miss a value added and deleted inside the pull request.
          fetch-depth: 0

      - name: Install gitleaks
        run: .github/scripts/secret-scan.sh install

      # A pull request: its own commits over the base it targets. A push: the commits it moved the
      # branch by; with no previous head (a new ref, or one a force-push removed), all of history.
      - name: Scan the commits this change adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/secret-scan.sh range "$BASE_SHA" "$HEAD_SHA"

      # Values are redacted in the report, so it is safe to keep.
      - name: Attach the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan
          path: artifacts/security/secret-scan/
          retention-days: 90
          if-no-files-found: ignore

  secret-scan-history:
    name: secret-scan-history
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      EVIDENCE_DIR: artifacts/security/secret-scan
    steps:
      - uses: actions/checkout@v4
        with:
          # Every branch and tag, so `--all` reaches every commit GitHub serves.
          fetch-depth: 0

      - name: Install gitleaks
        run: .github/scripts/secret-scan.sh install

      - name: Scan the full history
        id: scan
        run: .github/scripts/secret-scan.sh history

      # After a finding too, which is when it matters most. A scan that could not run leaves no
      # summary, and the report step then fails the run rather than telling the owner "clean".
      - name: Report to the named owner
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .github/scripts/report-to-owner.sh "Scheduled full-history secret scan"
          "$EVIDENCE_DIR/summary.md" "${{ steps.scan.outcome }}"

      - name: Attach the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-history
          path: artifacts/security/secret-scan/
          retention-days: 90
          if-no-files-found: ignore
