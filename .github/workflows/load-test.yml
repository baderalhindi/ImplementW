# Load test (TASK-086). Record: docs/testing/load-test.md
#
# k6 against the load stack: the e2e stack (src/frontend/e2e/stack) built from the commit, with the 140 load people and the
# TASK-026 representative volume (docs/testing/load-test/compose.yml). Two ways in:
#
#   pull request  a change to the harness runs the smoke profile: every role opens every screen once and each request must
#                 answer 2xx. It proves the harness and the volume still fit the API; it measures nothing.
#   dispatch      any profile (acceptance by default). The run's figures come from a GitHub runner, not SIT: they are
#                 attached for comparison, and the record's verdicts come from the run named in load-test.md §5.
#
# SIT is run by hand until it exists with the load people and the volume (load-test.md §7); nothing here holds its secrets.
name: load-test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "k6 profile"
        type: choice
        options: [acceptance, saturation, smoke]
        default: acceptance
  pull_request:
    branches: [main, dev, stage]
    paths:
      - docs/testing/load-test/**
      - src/frontend/e2e/stack/**
      - .github/workflows/load-test.yml

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load:
    name: load-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOAD_PROFILE: ${{ inputs.profile || 'smoke' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the load test against the load stack
        run: docs/testing/load-test/run.sh

      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for report in artifacts/load-test/*/report.md; do
            [ -f "$report" ] && cat "$report" >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Keep the stack's logs
        if: ${{ failure() }}
        run: |
          mkdir -p artifacts/load-test/stack-logs
          for service in e2e-api e2e-seed e2e-migrate e2e-postgres; do
            docker compose -f src/frontend/e2e/stack/compose.yml -f docs/testing/load-test/compose.yml logs --no-color "$service" \
              >"artifacts/load-test/stack-logs/$service.log" 2>&1 || true
          done

      - name: Attach the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: load-test-${{ env.LOAD_PROFILE }}
          path: artifacts/load-test/
          retention-days: 90
          if-no-files-found: warn
