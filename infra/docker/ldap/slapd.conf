# The test directory's configuration (TASK-028). Static slapd.conf: the directory is rebuilt, never reconfigured.
include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema

pidfile         /run/openldap/slapd.pid
argsfile        /run/openldap/slapd.args

modulepath      /usr/lib/openldap
moduleload      back_mdb.so

database        mdb
maxsize         10485760
suffix          "dc=pmplatform,dc=local"
directory       /var/lib/openldap/openldap-data
index           objectClass,uid,entryUUID eq

# A password is usable only to bind as its owner. The API's service account may read the people it looks up; nobody
# else, anonymous included, can search. No rootdn: the data is loaded with slapadd at build time and never written.
access to attrs=userPassword
        by anonymous auth
        by * none
access to *
        by dn.exact="cn=svc-pmplatform,ou=Services,dc=pmplatform,dc=local" read
        by self read
        by * none
