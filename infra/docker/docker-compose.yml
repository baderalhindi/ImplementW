# Local development stack (TASK-014): PostgreSQL 17 + PMPlatform.Api + Vite dev server, with seeded test data, and the
# test directory the API signs people in against (TASK-028).
#
#   docker compose -f infra/docker/docker-compose.yml up --build --wait     # from the repository root
#   curl -i http://localhost:5080/health                                     # 200 "Healthy" once the API has reached the database
#   open  http://localhost:5173                                              # frontend
#   docker compose -f infra/docker/docker-compose.yml down -v               # reset: drops the database volume, re-seeds on next up
#
# Every value below is a LOCAL DEFAULT and non-secret. Nothing here is valid outside this compose network: the
# database is reachable only through the published port, the JWT key is a labelled placeholder, and no SIT/UAT/PROD
# value is ever written here (those are injected from the secret store — TASK-016, TASK-019). The variables are the
# DEV-scoped rows of the Environment and Secrets sheet (docs/architecture/environment-templates.md §3.2) that this
# stack can satisfy; the rest stay unset and the API starts without them.
#
# Start-up order: ldap and postgres healthy → migrate (the API image's `migrate` command applies every EF Core migration and
# exits) → seed (db/seed's platform seed, the local users in ./postgres/seed, then db/seed's data-integrity check;
# all idempotent) → api. migrate and seed are one-shot containers that exit 0.
#
# Record: docs/architecture/local-development-environment.md

# Project name must be lowercase (Compose rejects "AHDA"); the containers carry the uppercase AHDA- names.
name: ahda

# The API image serves the API and, given `migrate`, applies the migrations (TASK-024), as the Cloud Run job does in
# each environment. Containers reach PostgreSQL by its service name; from the host it is localhost:5432.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile
x-database-connection: &database-connection Host=postgres;Port=5432;Database=pmplatform;Username=pmplatform;Password=pmplatform

services:
  postgres:
    container_name: AHDA-postgres
    # Same major as every environment (ADR-002 §4.1: PostgreSQL 17, fallback 16 fixed at TASK-020).
    image: postgres:17
    environment:
      POSTGRES_DB: pmplatform
      POSTGRES_USER: pmplatform
      POSTGRES_PASSWORD: pmplatform # local default; never a real credential
    ports:
      - "${PMPLATFORM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=pmplatform --dbname=pmplatform"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # TASK-028: the test directory (infra/docker/ldap), standing in for AHDA's Active Directory. One synthetic person per
  # role, each linked to the local user of that role by entryUUID. Sign in as local.r01 … local.r08 with the local
  # default password in ldap/directory.ldif. From the host it is ldap://localhost:3389; the integration tests use it.
  ldap:
    container_name: AHDA-ldap
    build:
      context: ./ldap
    ports:
      - "${PMPLATFORM_LDAP_PORT:-3389}:389"
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost", "-D", "cn=svc-pmplatform,ou=Services,dc=pmplatform,dc=local", "-w", "local-service-password"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    container_name: AHDA-migrate
    build: *api-build
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_CONNECTION_STRING: *database-connection

  # The platform seed (roles R01–R08 and master data, TASK-027), one local user per role (TASK-014), then the
  # data-integrity check, in one transaction after the tables exist: a violation fails `up` and leaves nothing written.
  # Idempotent, so it runs on every up.
  seed:
    container_name: AHDA-seed
    image: postgres:17
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: pmplatform
      PGPASSWORD: pmplatform # local default; never a real credential
      PGDATABASE: pmplatform
    volumes:
      - ../../db/seed:/db-seed:ro
      - ./postgres/seed:/seed:ro
    entrypoint: ["psql", "--no-psqlrc", "--quiet", "--set=ON_ERROR_STOP=1", "--single-transaction",
                 "--file=/db-seed/seed-master-data.sql", "--file=/seed/seed-local-users.sql", "--file=/db-seed/validate-data-integrity.sql"]

  api:
    container_name: AHDA-api
    build: *api-build
    depends_on:
      seed:
        condition: service_completed_successfully
      ldap:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Sheet names, verbatim (TASK-013 R-1): the API reads configuration["DB_CONNECTION_STRING"], and so on.
      DB_CONNECTION_STRING: *database-connection
      JWT_SIGNING_KEY: local-development-only-signing-key-not-valid-outside-docker-compose
      # TASK-028: the test directory above. The URL's path is the search base. The attribute names are OpenLDAP's
      # (AD's are the defaults), and plain LDAP is allowed only because this directory never leaves the compose network.
      AD_LDAP_URL: ldap://ldap:389/dc=pmplatform,dc=local
      AD_BIND_DN: cn=svc-pmplatform,ou=Services,dc=pmplatform,dc=local
      AD_BIND_PASSWORD: local-service-password # local default; never a real credential
      Identity__Directory__UsernameAttribute: uid
      Identity__Directory__SubjectAttribute: entryUUID
      Identity__Directory__DepartmentAttribute: departmentNumber
      Identity__Directory__AllowUnencryptedConnection: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:5173
      LOG_LEVEL: Information
      APM_ENVIRONMENT_TAG: dev
    ports:
      - "${PMPLATFORM_API_PORT:-5080}:8080" # 5080 matches Properties/launchSettings.json
    healthcheck:
      # /health is Healthy only when the API has opened a connection to postgres and run a query
      # (PMPlatform.Infrastructure/Persistence/PostgreSqlHealthCheck.cs).
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    container_name: AHDA-frontend
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      # The two .env.example rows a local stack can fill (TASK-013 R-4); SSO rows wait for TASK-028.
      VITE_APP_BASE_URL: http://localhost:5173
      VITE_APM_ENVIRONMENT_TAG: dev
    ports:
      - "${PMPLATFORM_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../src/frontend:/repo/src/frontend
      - frontend-node-modules:/repo/src/frontend/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  frontend-node-modules:
