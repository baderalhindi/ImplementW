# Secret-scanner configuration (TASK-019; owned by TASK-080's gate, CTL-42).
#
# The default rule set, plus scoped allowlists. Read by the `secret-scan` required check on every pull
# request and by the weekly full-history scan (.github/workflows/secret-scan.yml). A pull request is
# scanned with its *base's* copy of this file, so an allowlist must merge, reviewed by the Security
# Lead (CODEOWNERS), before the change that needs it; inline `gitleaks:allow` comments are ignored.
# Record: docs/architecture/secret-and-dependency-scanning.md
#
# Nothing here suppresses a rule globally. Each allowlist names the rule, the paths and the shape of
# the value, so a real credential in the same file is still found.
title = "PMPlatform"

[extend]
useDefault = true

# `generic-api-key` matches on a field name containing "key". `idempotencyKey` is the producer's
# natural key for an occurrence — a row id (event-conventions.md EV-4: "never a fresh uuid, never
# the HTTP Idempotency-Key, never the correlationId"). These five values are documentation samples
# of that field, validated against event-envelope.schema.json by docs/architecture/contract-check.py.
[[allowlists]]
description = "idempotencyKey values in the API and event documentation samples are row ids, not credentials (EV-4)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''docs/architecture/api-conventions-samples\.openapi\.json''',
  '''docs/architecture/event-samples/[^/]+\.json''',
]
regexes = ['''"idempotencyKey"\s*:\s*"[A-Za-z0-9-]+"''']

# `generic-api-key` reads the scan host `api077:8080/…` as a key named "api" followed by its value. ZAP's
# own reports of the TASK-077 API scan are full of request URLs on that host; these are paths, not
# credentials. Only a match that is such a URL is allowed, so a real token in the reports is still found.
[[allowlists]]
description = "Request URLs on the ZAP scan host in the TASK-077 API scan reports are paths, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''docs/architecture/zap/api-scan\.(html|json)''']
regexes = ['''^api077:8080/[A-Za-z0-9/_.-]*["\s]?$''']
